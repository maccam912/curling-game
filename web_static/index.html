<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="A 3D curling game built with Bevy and Rust">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Curling Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            /* Use dvh (dynamic viewport height) to account for mobile browser chrome */
            height: 100dvh;
            height: 100vh; /* Fallback for browsers that don't support dvh */
            overflow: hidden;
            background: #1a1a2e;
            /* Prevent overscroll bounce on iOS */
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            /* Account for safe area insets (notches, etc.) */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Prevent pull-to-refresh on mobile */
            touch-action: none;
        }

        canvas {
            display: block;
            /* Use dynamic viewport units for mobile browser chrome handling */
            max-width: 100dvw;
            max-height: 100dvh;
            width: 100dvw;
            height: 100dvh;
            /* Fallback for browsers without dvh support */
            max-width: 100vw;
            max-height: 100vh;
            /* Prevent context menu on long press */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Fallback using JavaScript-set CSS variables for older browsers */
        @supports not (height: 100dvh) {
            html, body {
                height: calc(var(--vh, 1vh) * 100);
            }
            canvas {
                max-height: calc(var(--vh, 1vh) * 100);
                height: calc(var(--vh, 1vh) * 100);
            }
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .loading-subtext {
            font-size: 0.85rem;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading Curling Game</div>
        <div class="loading-subtext">Preparing the ice...</div>
    </div>
    
    <script type="module">
        import init from './curling-game.js';

        function waitForCanvas() {
            return new Promise((resolve) => {
                const existingCanvas = document.querySelector('canvas');
                if (existingCanvas) {
                    resolve(existingCanvas);
                    return;
                }

                const observer = new MutationObserver(() => {
                    const canvas = document.querySelector('canvas');
                    if (canvas) {
                        observer.disconnect();
                        resolve(canvas);
                    }
                });

                observer.observe(document.body, { childList: true, subtree: true });
            });
        }

        function scaleCanvas(canvas) {
            const devicePixelRatio = window.devicePixelRatio || 1;
            // Use visualViewport if available (accounts for mobile browser chrome)
            const vv = window.visualViewport;
            const width = vv ? vv.width : window.innerWidth;
            const height = vv ? vv.height : window.innerHeight;

            // Set CSS custom property for fallback in older browsers
            document.documentElement.style.setProperty('--vh', `${height * 0.01}px`);

            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            canvas.width = Math.round(width * devicePixelRatio);
            canvas.height = Math.round(height * devicePixelRatio);
        }

        async function run() {
            try {
                await init();
                const canvas = await waitForCanvas();
                scaleCanvas(canvas);
                window.addEventListener('resize', () => scaleCanvas(canvas));
                // Also listen for visualViewport resize (mobile browser chrome changes)
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', () => scaleCanvas(canvas));
                }
                // Hide loading screen once WASM is initialized
                document.getElementById('loading').classList.add('hidden');
            } catch (error) {
                console.error('Failed to load game:', error);
                document.querySelector('.loading-text').textContent = 'Error Loading Game';
                document.querySelector('.loading-subtext').textContent = error.message;
                document.querySelector('.spinner').style.display = 'none';
            }
        }
        
        run();
    </script>
</body>
</html>
