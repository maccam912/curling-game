<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A 3D curling game built with Bevy and Rust">
    <title>Curling Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .loading-subtext {
            font-size: 0.85rem;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading Curling Game</div>
        <div class="loading-subtext">Preparing the ice...</div>
    </div>
    
    <script type="module">
        import init from './curling-game.js';
        
        async function run() {
            try {
                await init();
                // Hide loading screen once WASM is initialized
                document.getElementById('loading').classList.add('hidden');
            } catch (error) {
                console.error('Failed to load game:', error);
                document.querySelector('.loading-text').textContent = 'Error Loading Game';
                document.querySelector('.loading-subtext').textContent = error.message;
                document.querySelector('.spinner').style.display = 'none';
            }
        }
        
        run();
    </script>
</body>
</html>
