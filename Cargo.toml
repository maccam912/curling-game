[package]
name = "curling-game"
version = "0.1.0"
edition = "2024"

[dependencies]
# Dynamic linking for fast dev iteration (don't ship with this!)
bevy = { version = "0.17.3", features = ["dynamic_linking", "webp"] }
bevy_rapier2d = "0.32.0"
bevy_renet = { version = "3.0.0", optional = true }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
multiplayer = ["bevy_renet"]
# For debug mode feature (rapid fire, etc.)
debug_mode = []

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1
# Reduce debug info for faster compile + link (still debuggable)
debug = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
