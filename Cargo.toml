[package]
name = "curling-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.3"
bevy_rapier2d = { version = "0.32.0", features = ["enhanced-determinism"] }
bevy_matchbox = "0.13"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# For debug mode feature (rapid fire, etc.)
debug_mode = []

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1
# Reduce debug info for faster compile + link (still debuggable)
debug = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement", "Clipboard", "Navigator"] }
wasm-bindgen = "0.2"
